# ============================================================================
# Voltius documentation configuration
# https://zensical.org/docs/
# ============================================================================

[project]
site_name = "Voltius"
site_description = "Local-first SSH/SFTP/Serial client with E2EE sync, plugins, and no account required."
site_author = "Killian Pavy"
site_url = "https://docs.voltius.app"

repo_url = "https://github.com/VoltiusApp/voltius"
repo_name = "VoltiusApp/voltius"
edit_uri = "edit/main/docs/"

copyright = """
Copyright &copy; 2026 Killian Pavy &middot;
<a href="https://voltius.app">voltius.app</a>
"""

extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    "getting-started/index.md",
    "getting-started/install.md",
    "getting-started/first-connection.md",
    "getting-started/tour.md",
  ] },
  { "Connections" = [
    "connections/index.md",
    "connections/hosts.md",
    "connections/ssh.md",
    "connections/sftp.md",
    "connections/serial.md",
    "connections/local-terminal.md",
    "connections/jump-hosts.md",
    "connections/docker.md",
  ] },
  { "Organization" = [
    "organization/index.md",
    "organization/folders-tags.md",
    "organization/vaults.md",
    "organization/dashboard.md",
    "organization/import-export.md",
  ] },
  { "Keychain" = [
    "keychain/index.md",
    "keychain/ssh-keys.md",
    "keychain/identities.md",
    "keychain/known-hosts.md",
  ] },
  { "Terminal" = [
    "terminal/index.md",
    "terminal/panes.md",
    "terminal/snippets.md",
    "terminal/command-palette.md",
    "terminal/themes.md",
    "terminal/port-forwarding.md",
    "terminal/process-manager.md",
    "terminal/system-monitoring.md",
    "terminal/sharing.md",
  ] },
  { "Sync & Accounts" = [
    "sync/index.md",
    "sync/os-keychain.md",
    "sync/master-password.md",
    "sync/gist-sync.md",
    "sync/cloud-sync.md",
    "sync/web-portal.md",
  ] },
  { "Plugins" = [
    "plugins/index.md",
    "plugins/installing.md",
    "plugins/managing.md",
    "plugins/custom-repos.md",
    "plugins/developing.md",
  ] },
  { "Teams & Business" = [
    "teams/index.md",
    "teams/team-vaults.md",
    "teams/roles.md",
    "teams/members.md",
    "teams/audit-logs.md",
    "teams/terminal-sharing.md",
    "teams/billing.md",
  ] },
  { "Self-Hosting" = [
    "self-hosting/index.md",
    "self-hosting/quickstart.md",
    "self-hosting/environment.md",
    "self-hosting/admin-dashboard.md",
    "self-hosting/commercial-license.md",
  ] },
  { "Security" = [
    "security/index.md",
    "security/architecture.md",
    "security/encryption.md",
    "security/sync-protocol.md",
  ] },
  { "Reference" = [
    "reference/index.md",
    "reference/keyboard-shortcuts.md",
    "reference/troubleshooting.md",
    "reference/changelog.md",
    "reference/pricing.md",
  ] },
]

# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
[project.theme]
language = "en"
features = [
    "announce.dismiss",
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

# Drop your app icon into docs/assets/ to enable:
#logo = "assets/logo.svg"
#favicon = "assets/favicon.png"

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

# ----------------------------------------------------------------------------
# Social links in the footer
# ----------------------------------------------------------------------------
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/VoltiusApp/voltius"

[[project.extra.social]]
icon = "fontawesome/solid/globe"
link = "https://voltius.app"

# ----------------------------------------------------------------------------
# Markdown extensions (Zensical defaults + image captions for screenshots)
# ----------------------------------------------------------------------------
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.snippets]
url_download = true
url_max_size = 32768
url_timeout = 10.0
check_paths = true
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
[project.markdown_extensions.pymdownx.blocks.caption]
